; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  jgromes/RadioLib@^7.4.0
  knolleary/PubSubClient@^2.8

; ESP8266 target (tested pinout: Nodemcu v0.9).
; Uses a different GPIO map than ESP32 because ESP8266 hardware SPI pins are
; fixed - see README "Wiring (ESP8266)". Persistent state is stored via
; EEPROM emulation instead of Preferences/NVS, since that API is ESP32-only.
[env:nodemcu]
platform = espressif8266@^4
board = nodemcu
framework = arduino
monitor_speed = 115200

lib_deps =
  jgromes/RadioLib@^7.4.0
  knolleary/PubSubClient@^2.8

; NOTE: with two [env:...] sections, a bare `pio run` / `pio run -t upload`
; now builds/uploads BOTH boards in turn. Use `-e esp32dev` or `-e nodemcu`
; to target just one, e.g.:
;   pio run -e nodemcu -t upload
;   pio device monitor -e nodemcu -b 115200